name: Auto PR and Merge

on:
  push:
    branches:
      - main2

jobs:
  create-and-merge-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create PR if not exists
        run: |
          gh pr create \
            --title "Auto PR desde main2" \
            --body "PR creado automáticamente" \
            --base main \
            --head main2 || echo "PR ya existe, continuando..."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge PR
        run: |
          gh pr merge main2 --merge --admin --delete-branch=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}