name: Auto PR and Merge

on:
  push:
    branches:
      - main2

jobs:
  create-and-merge-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Crea el PR desde main2 hacia main
      - name: Create Pull Request
        id: create_pr
        run: |
          PR_URL=$(gh pr create \
            --title "Auto PR desde main2" \
            --body "PR creado automáticamente" \
            --base main \
            --head main2)
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Mergea el PR automáticamente
      - name: Merge PR
        run: |
          gh pr merge main2 --merge --admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}